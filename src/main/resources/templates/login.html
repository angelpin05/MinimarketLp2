<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head><body>
<main class="login"><p class="eyebrow">VENTAS E INVENTARIO</p><h1>Minimarket LP2</h1><p>Ingresa con tu cuenta para administrar el negocio.</p>
<div class="errors" th:if="${param.error}">Usuario o contraseña incorrectos.</div><div class="notice" th:if="${param.logout}">Sesión cerrada.</div>
<form method="post" th:action="@{/login}"><label for="username">Usuario</label><input id="username" name="username" required maxlength="50" autocomplete="username">
<label for="password">Contraseña</label><input id="password" type="password" name="password" required autocomplete="current-password"><button type="submit">Ingresar</button></form>
</main></body></html>
