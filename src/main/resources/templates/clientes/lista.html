<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Clientes')}"></head><body><header th:replace="~{fragments/layout :: nav}"></header>
<main><div class="page-heading"><h1>Clientes</h1><a class="button" th:href="@{/clientes/nuevo}">Nuevo registro</a></div><div th:replace="~{fragments/layout :: messages}"></div>
<div class="table-wrap"><table><thead><tr><th scope="col">Documento</th><th scope="col">Nombre</th><th scope="col">Teléfono</th><th scope="col">Correo</th><th scope="col">Estado</th><th scope="col">Acciones</th></tr></thead><tbody><tr th:each="f:${filas}"><td th:text="${f.documento}"></td><td th:text="${f.nombre}"></td><td th:text="${f.telefono}"></td><td th:text="${f.correo}"></td><td th:text="${f.activo} ? 'Activo' : 'Inactivo'"></td><td class="actions"><a th:href="@{/clientes/{id}/editar(id=${f.id})}">Editar</a>
<form th:if="${f.activo}" method="post" th:action="@{/clientes/{id}/desactivar(id=${f.id})}"><button class="danger" type="submit">Desactivar</button></form></td></tr>
<tr th:if="${#lists.isEmpty(filas)}"><td colspan="6">Sin registros.</td></tr></tbody></table></div></main></body></html>
