<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Mantenimiento')}"></head><body><header th:replace="~{fragments/layout :: nav}"></header><main class="narrow">
<h1 th:text="${id} == null ? 'Nuevo registro' : 'Editar registro'"></h1><form method="post" th:action="${id} == null ? @{/categorias/guardar} : @{/categorias/{id}/guardar(id=${id})}" th:object="${form}">
<div th:replace="~{fragments/layout :: errors}"></div><label for="nombre">Nombre</label><input id="nombre" type="text" th:field="*{nombre}" required maxlength="80">
<label for="descripcion">Descripción</label><input id="descripcion" type="text" th:field="*{descripcion}" maxlength="200">
<label class="check"><input type="checkbox" th:field="*{activo}">Activo</label>
<div class="form-actions"><button type="submit">Guardar</button><a class="button secondary" th:href="@{/categorias}">Cancelar</a></div></form></main></body></html>
