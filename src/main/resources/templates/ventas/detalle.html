<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Detalle de venta')}"></head><body><header th:replace="~{fragments/layout :: nav}"></header><main>
<h1 th:text="'Venta '+${venta.id}"></h1><p class="notice">Venta registrada y stock actualizado.</p><p><strong>Cliente:</strong> <span th:text="${venta.cliente.nombre}"></span></p><p><strong>Fecha:</strong> <span th:text="${#temporals.format(venta.fecha,'dd/MM/yyyy HH:mm')}"></span> <strong>Vendedor:</strong> <span th:text="${venta.usuario.username}"></span></p>
<div class="table-wrap"><table><thead><tr><th>Producto</th><th>Cantidad</th><th>Precio S/</th><th>Subtotal S/</th></tr></thead><tbody><tr th:each="d:${venta.detalles}"><td th:text="${d.nombreProducto}"></td><td th:text="${d.cantidad}"></td><td th:text="${#numbers.formatDecimal(d.precioUnitario,1,2)}"></td><td th:text="${#numbers.formatDecimal(d.subtotal,1,2)}"></td></tr></tbody></table></div><p class="total">Total S/ <strong th:text="${#numbers.formatDecimal(venta.total,1,2)}"></strong></p><a class="button" th:href="@{/ventas/nueva}">Nueva venta</a><a class="button secondary" th:href="@{/consultas/ventas}">Historial</a><p class="muted">Registro interno de venta. No constituye comprobante tributario.</p></main></body></html>
