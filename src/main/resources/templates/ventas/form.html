<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Nueva venta')}"></head><body><header th:replace="~{fragments/layout :: nav}"></header><main>
<h1>Nueva venta</h1><p>Elige productos y cantidades. El sistema confirma los precios y las existencias al guardar.</p><form method="post" th:action="@{/ventas/registrar}" th:object="${form}" id="venta-form">
<div th:replace="~{fragments/layout :: errors}"></div><input type="hidden" th:field="*{token}"><label for="clienteId">Cliente</label><select id="clienteId" th:field="*{clienteId}" required><option value="">Selecciona un cliente</option><option th:each="c:${clientes}" th:value="${c.id}" th:text="${c.nombre}+' - '+${c.documento}"></option></select>
<div class="table-wrap"><table><thead><tr><th>Producto</th><th>Cantidad</th><th></th></tr></thead><tbody id="lineas">
<tr th:each="l,s:*{lineas}"><td><select class="producto" th:field="*{lineas[__${s.index}__].productoId}" required aria-label="Producto"><option value="">Selecciona</option><option th:each="p:${productos}" th:value="${p.id}" th:text="${p.nombre}+' - S/ '+${p.precio}+' - stock '+${p.stock}"></option></select></td><td><input class="cantidad" type="number" th:field="*{lineas[__${s.index}__].cantidad}" required min="1" max="100000" aria-label="Cantidad"></td><td><button class="secondary quitar" type="button">Quitar</button></td></tr>
</tbody></table></div><p><button type="button" class="secondary" id="agregar">Agregar producto</button></p><p class="muted">Si repites un producto, el sistema suma sus cantidades. Máximo 30 líneas.</p><div class="form-actions"><button id="guardar" type="submit">Registrar venta</button><a class="button secondary" th:href="@{/}">Cancelar</a></div></form>
<template id="linea-template"><tr><td><select class="producto" required aria-label="Producto"><option value="">Selecciona</option><option th:each="p:${productos}" th:value="${p.id}" th:text="${p.nombre}+' - S/ '+${p.precio}+' - stock '+${p.stock}"></option></select></td><td><input class="cantidad" type="number" value="1" required min="1" max="100000" aria-label="Cantidad"></td><td><button class="secondary quitar" type="button">Quitar</button></td></tr></template>
<script th:src="@{/js/venta.js}" defer></script></main></body></html>
