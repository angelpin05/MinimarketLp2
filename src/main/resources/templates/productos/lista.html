<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Productos')}"></head><body><header th:replace="~{fragments/layout :: nav}"></header>
<main><div class="page-heading"><h1>Productos</h1><a class="button" th:href="@{/productos/nuevo}">Nuevo registro</a></div><div th:replace="~{fragments/layout :: messages}"></div>
<div class="table-wrap"><table><thead><tr><th scope="col">Código</th><th scope="col">Nombre</th><th scope="col">Categoría</th><th scope="col">Precio S/</th><th scope="col">Stock</th><th scope="col">Mínimo</th><th scope="col">Estado</th><th scope="col">Acciones</th></tr></thead><tbody><tr th:each="f:${filas}"><td th:text="${f.codigo}"></td><td th:text="${f.nombre}"></td><td th:text="${f.categoria.nombre}"></td><td th:text="${f.precio}"></td><td th:text="${f.stock}"></td><td th:text="${f.stockMinimo}"></td><td th:text="${f.activo} ? 'Activo' : 'Inactivo'"></td><td class="actions"><a th:href="@{/productos/{id}/editar(id=${f.id})}">Editar</a>
<form th:if="${f.activo}" method="post" th:action="@{/productos/{id}/desactivar(id=${f.id})}"><button class="danger" type="submit">Desactivar</button></form></td></tr>
<tr th:if="${#lists.isEmpty(filas)}"><td colspan="8">Sin registros.</td></tr></tbody></table></div></main></body></html>
