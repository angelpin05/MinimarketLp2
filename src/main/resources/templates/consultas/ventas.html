<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/layout :: head('Consulta de ventas')}"></head><body><header th:replace="~{fragments/layout :: nav}"></header><main>
<h1>Consulta de ventas</h1><form class="filters" method="get" th:action="@{/consultas/ventas}"><div><label for="desde">Desde</label><input id="desde" name="desde" type="date" th:value="${desde}" required></div><div><label for="hasta">Hasta</label><input id="hasta" name="hasta" type="date" th:value="${hasta}" required></div>
<div><label for="cliente">Cliente</label><select id="cliente" name="cliente"><option value="">Todos</option><option th:each="c:${clientes}" th:value="${c.id}" th:selected="${c.id == cliente}" th:text="${c.nombre}"></option></select></div><button type="submit">Consultar</button></form>
<p sec:authorize="hasRole('ADMIN')"><a class="button secondary" th:href="@{/reportes/ventas.pdf(desde=${desde},hasta=${hasta},cliente=${cliente})}">Descargar reporte PDF</a></p>
<div class="table-wrap"><table><thead><tr><th>Venta</th><th>Fecha</th><th>Cliente</th><th>Vendedor</th><th>Total S/</th><th>Detalle</th></tr></thead><tbody><tr th:each="v:${filas}"><td th:text="${v.id}"></td><td th:text="${#temporals.format(v.fecha,'dd/MM/yyyy HH:mm')}"></td><td th:text="${v.cliente.nombre}"></td><td th:text="${v.usuario.username}"></td><td th:text="${#numbers.formatDecimal(v.total,1,2)}"></td><td><a th:href="@{/ventas/{id}(id=${v.id})}">Ver detalle</a></td></tr>
<tr th:if="${#lists.isEmpty(filas)}"><td colspan="6">No hay ventas para estos filtros.</td></tr></tbody></table></div><p class="total">Total del período S/ <strong th:text="${#numbers.formatDecimal(total,1,2)}"></strong></p></main></body></html>
