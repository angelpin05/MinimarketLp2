<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/layout :: head('Consulta de inventario')}"></head><body><header th:replace="~{fragments/layout :: nav}"></header><main>
<h1>Consulta de inventario</h1><form class="filters" method="get" th:action="@{/consultas/inventario}"><div><label for="categoria">Categoría</label><select id="categoria" name="categoria"><option value="">Todas</option><option th:each="c:${categorias}" th:value="${c.id}" th:selected="${c.id == categoria}" th:text="${c.nombre}"></option></select></div>
<div><label for="texto">Código o nombre</label><input id="texto" name="texto" th:value="${texto}" maxlength="120"></div><label class="check"><input name="bajo" type="checkbox" value="true" th:checked="${bajo}">Solo stock bajo</label><button type="submit">Consultar</button></form>
<p sec:authorize="hasRole('ADMIN')"><a class="button secondary" th:href="@{/reportes/inventario.pdf(categoria=${categoria},texto=${texto},bajo=${bajo})}">Descargar reporte PDF</a></p>
<div class="table-wrap"><table><thead><tr><th>Código</th><th>Producto</th><th>Categoría</th><th>Precio S/</th><th>Stock</th><th>Mínimo</th><th>Situación</th></tr></thead>
<tbody><tr th:each="p:${filas}"><td th:text="${p.codigo}"></td><td th:text="${p.nombre}"></td><td th:text="${p.categoria.nombre}"></td><td th:text="${#numbers.formatDecimal(p.precio,1,2)}"></td><td th:text="${p.stock}"></td><td th:text="${p.stockMinimo}"></td><td th:text="${p.stock <= p.stockMinimo} ? 'Reponer' : 'Disponible'"></td></tr><tr th:if="${#lists.isEmpty(filas)}"><td colspan="7">No hay productos para estos filtros.</td></tr></tbody></table></div></main></body></html>
